<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Wishlist | REVIVE</title>

    <link rel="stylesheet" href="../css/account.css">
</head>

<body>

    <header class="account-header">

        <a href="../index.html" class="account-brand">

            <span class="brand-symbol">
                RS
            </span>

            <span>
                <strong>REVIVE</strong>
                <small>SCENTS &amp; SKIN CARE</small>
            </span>

        </a>

        <nav>

            <a href="dashboard.html">
                Account
            </a>

            <a href="../shop.html">
                Shop
            </a>

            <a href="../cart.html">
                Cart
                <span id="cartCount">0</span>
            </a>

        </nav>

    </header>


    <main class="account-page">

        <a href="dashboard.html" class="back-link">
            ← Back to account
        </a>


        <section class="account-page-heading">

            <span class="account-eyebrow">
                MY REVIVE
            </span>

            <h1>
                My Wishlist ♡
            </h1>

            <p>
                Products you've saved for later.
            </p>

        </section>


        <div
            id="wishlistMessage"
            class="wishlist-message"
        ></div>


        <section id="wishlistContainer">

            <div class="account-loading">

                Loading your wishlist...

            </div>

        </section>

    </main>


    <footer class="account-footer">

        <span>

            ©
            <span id="year"></span>

            Revive Scents and Skin Care Solutions.

        </span>

        <span>
            From concerns to confidence ♡
        </span>

    </footer>


    <script
        type="module"
        src="../js/wishlist.js"
    ></script>

</body>

</html>

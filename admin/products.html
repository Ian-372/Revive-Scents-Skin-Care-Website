<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products | Revive Admin</title>

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

    <header class="admin-header">

        <div>
            <strong>REVIVE</strong>
            <span>ADMIN</span>
        </div>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="products.html" class="active">Products</a>
            <a href="orders.html">Orders</a>
            <a href="customers.html">Customers</a>
        </nav>

    </header>


    <main class="admin-page">

        <div class="admin-heading">

            <div>
                <span class="eyebrow">PRODUCT MANAGEMENT</span>
                <h1>Products</h1>
                <p>Add, edit and manage Revive products.</p>
            </div>

            <button id="addProductButton">
                + Add Product
            </button>

        </div>


        <div id="productMessage"></div>


        <section class="admin-card">

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="productsTable">

                        <tr>
                            <td colspan="6">
                                Loading products...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- PRODUCT MODAL -->

    <div class="modal" id="productModal">

        <div class="modal-content">

            <button class="modal-close" id="closeProductModal" type="button">
                ×
            </button>

            <span class="eyebrow">
                REVIVE CATALOGUE
            </span>

            <h2 id="modalTitle">
                Add Product
            </h2>

            <form id="productForm">

                <input type="hidden" id="productId">

                <div class="form-group">

                    <label for="productName">
                        Product name
                    </label>

                    <input type="text" id="productName" required>

                </div>


                <div class="form-group">

                    <label for="productCategory">
                        Category
                    </label>

                    <select id="productCategory" required>

                        <option value="">
                            Select category
                        </option>

                        <option value="face">
                            Face
                        </option>

                        <option value="body">
                            Body
                        </option>

                        <option value="targeted">
                            Targeted Care
                        </option>

                        <option value="scent">
                            Scents
                        </option>

                        <option value="men">
                            Men's Care
                        </option>

                        <option value="hair">
                            Hair & Style
                        </option>

                    </select>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="productPrice">
                            Price (KSh)
                        </label>

                        <input type="number" id="productPrice" min="0" required>

                    </div>


                    <div class="form-group">

                        <label for="productStock">
                            Stock
                        </label>

                        <input type="number" id="productStock" min="0" required>

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Product Image
                    </label>

                    <input type="file" id="productImage" accept="image/*">

                    <small>
                        Choose an image or use your device camera.
                    </small>

                    <div id="imagePreview" class="image-preview"></div>

                </div>


                <div class="form-group">

                    <label for="productDescription">
                        Description
                    </label>

                    <textarea id="productDescription" rows="4"></textarea>

                </div>


                <label class="checkbox-row">

                    <input type="checkbox" id="productActive" checked>

                    <span>
                        Product is active and visible in the shop
                    </span>

                </label>


                <button type="submit" id="saveProductButton">
                    Save Product
                </button>

            </form>

        </div>

    </div>


    <script type="module" src="../js/admin.js"></script>

</body>

</html>

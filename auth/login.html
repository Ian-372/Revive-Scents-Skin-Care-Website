<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | REVIVE</title>
    <link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

<main class="auth-page">

    <div class="auth-card">

        <a href="../index.html" class="auth-logo">
            <span>RS</span>
            <strong>REVIVE</strong>
            <small>SCENTS &amp; SKIN CARE SOLUTIONS</small>
        </a>

        <div class="auth-heading">
            <span>WELCOME BACK</span>
            <h1>Log in to REVIVE</h1>
            <p>Access your orders, wishlist and personalised Revive experience.</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <div class="login-options">
                <label class="checkbox-row">
                    <input type="checkbox" id="rememberMe">
                    <span>Remember me</span>
                </label>

                <a href="forgot-password.html">
                    Forgot password?
                </a>
            </div>

            <p class="form-message" id="loginMessage"></p>

            <button
                type="submit"
                class="auth-button"
                id="loginButton"
            >
                Log In
            </button>

        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="register.html">Create one</a>
        </p>

    </div>

</main>

<script type="module" src="../js/auth.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | REVIVE</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <a href="../index.html" class="auth-logo">
                <span>RS</span>
                <strong>REVIVE</strong>
                <small>SCENTS & SKIN CARE SOLUTIONS</small>
            </a>

            <div class="auth-heading">
                <span>WELCOME TO REVIVE</span>
                <h1>Create your account</h1>
                <p>Save your favourites, track your orders and make your Revive experience personal.</p>
            </div>

            <form id="registerForm">

                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First name</label>
                        <input
                            type="text"
                            id="firstName"
                            required
                            autocomplete="given-name"
                        >
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last name</label>
                        <input
                            type="text"
                            id="lastName"
                            required
                            autocomplete="family-name"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone number</label>
                    <input
                        type="tel"
                        id="phone"
                        required
                        autocomplete="tel"
                        placeholder="07XXXXXXXX"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        required
                        minlength="8"
                        autocomplete="new-password"
                    >
                    <small>At least 8 characters.</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        required
                        minlength="8"
                        autocomplete="new-password"
                    >
                </div>

                <label class="checkbox-row">
                    <input type="checkbox" id="terms" required>
                    <span>I agree to REVIVE's terms and privacy policy.</span>
                </label>

                <p class="form-message" id="registerMessage"></p>

                <button type="submit" class="auth-button" id="registerButton">
                    Create Account
                </button>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

        </div>

    </main>

    <script type="module" src="../js/auth.js"></script>

</body>
</html>

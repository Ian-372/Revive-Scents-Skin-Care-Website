<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Reset your REVIVE account password."
    >

    <title>Forgot Password | REVIVE</title>

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

<link rel="stylesheet" href="../css/responsive.css">
</head>


<body>

<main class="auth-page">

    <div class="auth-card">


        <!-- =================================================
             LOGO
        ================================================== -->

        <a
            href="../index.html"
            class="auth-logo"
        >

            <span>
                RS
            </span>

            <div>

                <strong>
                    REVIVE
                </strong>

                <small>
                    SCENTS &amp; SKIN CARE SOLUTIONS
                </small>

            </div>

        </a>



        <!-- =================================================
             HEADING
        ================================================== -->

        <div class="auth-heading">

            <span>
                ACCOUNT RECOVERY
            </span>

            <h1>
                Forgot your
                <em>password?</em>
            </h1>

            <p>
                No worries. Enter the email address
                connected to your REVIVE account and
                we'll send you a secure password reset link.
            </p>

        </div>



        <!-- =================================================
             FORM
        ================================================== -->

        <form id="forgotPasswordForm">


            <div class="form-group">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>



            <!-- MESSAGE -->

            <p
                class="form-message"
                id="forgotMessage"
                aria-live="polite"
            ></p>



            <!-- BUTTON -->

            <button
                type="submit"
                class="auth-button"
                id="resetButton"
            >
                Send reset link
            </button>


        </form>



        <!-- =================================================
             BACK TO LOGIN
        ================================================== -->

        <p class="auth-switch">

            Remember your password?

            <a href="login.html">
                Log in
            </a>

        </p>


    </div>

</main>



<script type="module">

    import {
        sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
        auth
    } from "../js/firebase-config.js";


    const form =
        document.getElementById(
            "forgotPasswordForm"
        );


    const emailInput =
        document.getElementById(
            "email"
        );


    const message =
        document.getElementById(
            "forgotMessage"
        );


    const resetButton =
        document.getElementById(
            "resetButton"
        );



    form.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const email =
                emailInput.value.trim();


            if (!email) {

                showMessage(
                    "Please enter your email address.",
                    "error"
                );

                return;

            }


            try {

                resetButton.disabled =
                    true;

                resetButton.textContent =
                    "Sending...";


                await sendPasswordResetEmail(
                    auth,
                    email
                );


                showMessage(
                    "Reset link sent. Please check your email.",
                    "success"
                );


                form.reset();


            } catch (error) {

                console.error(
                    "Password reset error:",
                    error
                );


                let errorMessage =
                    "Unable to send the reset link. Please try again.";


                if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    errorMessage =
                        "No REVIVE account was found with that email.";

                }


                if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    errorMessage =
                        "Please enter a valid email address.";

                }


                if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    errorMessage =
                        "Too many attempts. Please wait a little and try again.";

                }


                showMessage(
                    errorMessage,
                    "error"
                );


            } finally {

                resetButton.disabled =
                    false;

                resetButton.textContent =
                    "Send reset link";

            }

        }
    );



    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            `form-message ${type}`;

    }

</script>

</body>

</html>
